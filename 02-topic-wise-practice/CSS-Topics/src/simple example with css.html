<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic CSS Styling</title>

<style>
    /* Style the main container */
    .box {
        /* 1. Size of the container */
        width: 320px;

        /* 2. Spacing around and inside the box */
        padding: 18px;
        margin: 50px auto;

        /* 3. Box appearance */
        background-color: #ffffff;
        border: 2px solid #8e44ad;
        border-radius: 10px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);

        /* 4. Text formatting */
        font-family: Arial, sans-serif;
        text-align: center;
    }

    /* Style the button */
    .button {
        /* 5. Button colors and spacing */
        background-color: #e67e22;
        color: white;

        border: none;
        padding: 10px 18px;
        border-radius: 5px;
        font-weight: bold;
        cursor: pointer;
    }
</style>


</head>

<body>

<div class="box">
    <h2 style="color: #8e44ad; margin-top: 0;">
        CSS Basics
    </h2>

    <p style="color: #555; line-height: 1.5;">
        This example shows how simple CSS properties can be used
        to design and format an HTML container.
    </p>

    <button class="button">Learn More</button>
</div>


</body>

</html>
